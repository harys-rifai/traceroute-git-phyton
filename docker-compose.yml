version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=nslookupDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Password09!
    ports:
      - "5008:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=nslookupDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Password09!
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped

  celery:
    build: .
    command: celery -A network_globe worker -l info
    volumes:
      - .:/app
    environment:
      - POSTGRES_DB=nslookupDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Password09!
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped

  celery-beat:
    build: .
    command: celery -A network_globe beat -l info
    volumes:
      - .:/app
    environment:
      - POSTGRES_DB=nslookupDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Password09!
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
